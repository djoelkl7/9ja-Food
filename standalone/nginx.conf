# Nginx Configuration Block for Naija Pot Kitchen & Grill Ltd
server {
    listen 80;
    listen [::]:80;
    server_name naijapotkitchen.co.uk www.naijapotkitchen.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name naijapotkitchen.co.uk www.naijapotkitchen.co.uk;

    root /var/www/naijapot;
    index index.html;

    # SSL certificates (replace with your cert paths)
    # ssl_certificate /etc/letsencrypt/live/naijapotkitchen.co.uk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/naijapotkitchen.co.uk/privkey.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Asset Caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
